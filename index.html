<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8431c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Trainingstagebuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app, sticky header, bottom tab bar; cards for routines and exercises */
:root{
  /* Gym-Hero-Orange: kräftige Leiste oben, sonst helle, ruhige Flächen */
  --bg:#f2f2f4;
  --card:#ffffff;
  --ink:#1b1b1f;
  --muted:#6b6b73;
  --line:#e2e2e6;
  --bar:#e8431c;
  --bar-ink:#ffffff;
  --accent:#c9360f;
  --accent-ink:#ffffff;
  --accent-soft:#fde9e2;
  --field:#efeff2;
  --good:#1d7a4a;
  --good-soft:#dff2e7;
  --danger:#c9360f;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121214;--card:#1d1d21;--ink:#ececf0;--muted:#a0a0aa;--line:#2e2e34;
    --bar:#c9370f;--bar-ink:#ffffff;--accent:#ff7a52;--accent-ink:#1a0a05;--accent-soft:#3a1e15;--field:#26262b;
    --good:#5fd394;--good-soft:#173527;--danger:#ff8a70;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121214;--card:#1d1d21;--ink:#ececf0;--muted:#a0a0aa;--line:#2e2e34;
  --bar:#c9370f;--bar-ink:#ffffff;--accent:#ff7a52;--accent-ink:#1a0a05;--accent-soft:#3a1e15;--field:#26262b;
  --good:#5fd394;--good-soft:#173527;--danger:#ff8a70;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
/* iOS zooms into any field with text smaller than 16px: keep every field at 16px or more */
input,select,textarea{font-size:max(16px,1em)}
h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(22px,6.5vw,28px);line-height:1.1;overflow-wrap:break-word;hyphens:manual}
h1.long{font-size:clamp(18px,5.2vw,24px)}
h2{font-size:22px;line-height:1.15;font-weight:700}
h3{font-size:19px;line-height:1.2}
.num{font-variant-numeric:tabular-nums}
.app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 rgba(0,0,0,.08)}
header.top h1{flex:1;text-transform:uppercase;font-weight:700;letter-spacing:.03em;text-align:center}
header.top #topLeft,header.top #topRight{min-width:56px;display:flex;align-items:center}
header.top #topRight{justify-content:flex-end}
header.top .btn{color:var(--bar-ink);background:transparent;border-color:transparent}
header.top .btn.primary{background:transparent;border-color:rgba(255,255,255,.7);font-weight:600}
header.top .timer{color:var(--bar-ink)}
main{flex:1;padding:16px 16px 96px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .inner{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.spread{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.small{min-height:32px;padding:5px 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.banner{border-radius:var(--r);padding:10px 12px;background:var(--accent-soft);font-size:14px}
.banner.warn{background:#fff1d6;color:#5a3a00}
:root[data-theme="dark"] .banner.warn{background:#3a2c10;color:#f3d9a4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.warn{background:#3a2c10;color:#f3d9a4}}
.empty{text-align:left;padding:18px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:26px;font-weight:600;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input.in,select.in,textarea.in{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;min-height:40px;width:100%;color:var(--ink)}
textarea.in{min-height:64px;resize:vertical}
/* active workout */
.ex-card .head{display:flex;align-items:flex-start;gap:8px}
.ex-card .head h3{flex:1}
.last{font-size:13px;color:var(--muted)}
.note{font-size:13px;background:var(--accent-soft);border-radius:6px;padding:6px 8px}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 44px;gap:6px 8px;align-items:center}
.sets .h{font-size:12px;color:var(--muted)}
.sets input{text-align:center;font-variant-numeric:tabular-nums}
.sets .idx{font-family:var(--display);font-size:18px;color:var(--muted);text-align:center}
.tick{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center}
.tick svg{width:20px;height:20px;opacity:.25}
.tick[aria-pressed="true"]{background:var(--good-soft);border-color:var(--good)}
.tick[aria-pressed="true"] svg{opacity:1;color:var(--good)}
.done-row input{border-color:var(--good)}
.timer{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
/* history */
.month{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.wk{cursor:pointer}
.wk .meta{font-size:13px;color:var(--muted)}
.wk-detail{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.wk-detail .line{display:flex;gap:10px;font-size:14px}
.wk-detail .line b{font-weight:500;flex:1;min-width:0}
/* progress */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 12px;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--card);font-size:12px;padding:6px 8px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .1s}
@media (prefers-reduced-motion: reduce){.tip{transition:none}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px 4px}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
/* routine editor */
.ed-ex{display:grid;grid-template-columns:1fr 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;padding:10px}
.ed-ex .full{grid-column:1/-1}
.ed-ex .tools{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
/* modal + toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:560px){.modal-bg{align-items:center}}
.modal{background:var(--card);border-radius:14px;padding:18px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 14px;border-radius:8px;z-index:30;font-size:14px;max-width:90%}
.hidden{display:none !important}
@media (max-width:400px){.stat b{font-size:22px}}

.btn.big{min-height:52px;font-size:17px}
.back{font-size:28px;line-height:1;padding:0 8px;min-height:36px}
.picklist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pick{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;cursor:pointer;min-height:48px}
.pick:last-child{border-bottom:0}
.pick.sel{background:var(--accent-soft);font-weight:600}
.switch{width:52px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.switch span{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-checked="true"]{background:var(--good)}
.switch[aria-checked="true"] span{left:25px}
@media (prefers-reduced-motion: reduce){.switch span{transition:none}}
.exlist{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.exrow{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 14px;cursor:pointer;min-height:56px}
.exrow:last-child{border-bottom:0}
.exrow .grow{display:flex;flex-direction:column}
.exrow.has b{color:var(--accent)}
.exrow b{font-weight:600}
.exrow.add{color:var(--accent);font-weight:500}
.chev{color:var(--muted);font-size:22px}
.sets2{display:flex;flex-direction:column;gap:2px}
.setrow{display:grid;grid-template-columns:64px 1fr 14px 1fr 22px 36px;align-items:center;gap:6px}
.slabel{color:var(--muted);font-size:14px}
.slabel.on{color:var(--ink);font-weight:600}
.val{text-align:center;font-size:22px;font-family:var(--display);font-weight:600;min-height:48px;font-variant-numeric:tabular-nums;background:var(--field);border-color:transparent}
.val::placeholder{color:var(--muted);opacity:.55}
.val.on{color:var(--ink)}
.val:focus{background:var(--bar);color:#fff;border-color:var(--bar);outline:none}
.val:focus::placeholder{color:#fff;opacity:.7}
.val::selection{background:rgba(255,255,255,.35);color:#fff}
.x{color:var(--muted);text-align:center}
.del{border:0;background:none;color:var(--danger);font-size:22px;cursor:pointer;min-height:40px}
.lasttime{font-size:12px;color:var(--muted);text-align:right;padding:0 42px 8px 0;min-height:14px}
.navbar{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.navbar .ghost{font-size:22px;color:var(--accent)}
.addset{color:var(--accent);background:transparent;border-color:transparent;font-weight:700;font-family:var(--display);font-size:18px;letter-spacing:.04em}
button.card.wk{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumgrid div{display:flex;flex-direction:column}
.sumgrid span{font-size:12px;color:var(--muted)}
.sumgrid b{font-family:var(--display);font-size:24px;font-weight:600;white-space:nowrap}
.summary{background:var(--bar);border-color:var(--bar);color:#fff}
.summary .muted,.summary .sumgrid span{color:rgba(255,255,255,.85)}
.summary .chip{background:rgba(255,255,255,.2);color:#fff}
.summary .note{background:rgba(255,255,255,.18)}
.setup{display:flex;flex-direction:column;gap:2px;background:var(--card);border:2px solid var(--bar);border-radius:var(--r);padding:10px 12px}
.setup b{font-size:18px}
.proghint{display:flex;flex-direction:column;gap:6px;align-items:flex-start;background:var(--good-soft);border-radius:var(--r);padding:10px 12px}
.proghint b{color:var(--good)}
.proghint.comeback{background:var(--accent-soft)}
.proghint.comeback b{color:var(--accent)}
.lasttime.rec{color:var(--accent);font-weight:600}
.recline{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.02em}
.recbadge{display:flex;flex-direction:column;background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:14px}
.recbadge b{color:var(--accent)}
details.conf summary{cursor:pointer;display:flex;flex-direction:column;gap:2px;list-style:none}
details.conf summary::-webkit-details-marker{display:none}
details.conf summary b::after{content:" ▾";color:var(--muted)}
details.conf[open] summary b::after{content:" ▴"}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.grow-row{display:flex;flex-direction:column;gap:4px;padding:6px 0}
.bar{position:relative;height:14px;background:var(--field);border-radius:4px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--bar);border-radius:4px}
.bar .tick-now{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--ink);border-radius:2px}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.lg-fill{display:inline-block;width:14px;height:10px;background:var(--bar);border-radius:3px;margin-left:4px}
.lg-tick{display:inline-block;width:3px;height:14px;background:var(--ink);border-radius:2px;margin-left:10px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top"><div id="topLeft"></div><h1 id="title">Trainingslog</h1><div id="topRight"></div></header>
  <main id="main"><p class="muted">Daten werden geladen …</p></main>
</div>
<nav class="tabs" id="tabs"><div class="inner">
  <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Training</button>
  <button data-v="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Verlauf</button>
  <button data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Fortschritt</button>
  <button data-v="routines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Routinen</button>
  <button data-v="data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>Daten</button>
</div></nav>

<script>
"use strict";
const APP_VERSION="2026-11-15d";
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
function h(tag, attrs={}, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null || v===false) continue;
    if (k==="class") el.className=v;
    else if (k==="text") el.textContent=v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?"":v);
  }
  for (const k of kids.flat()){ if (k==null||k===false) continue; el.append(k.nodeType?k:document.createTextNode(String(k))); }
  return el;
}
const clone = o => JSON.parse(JSON.stringify(o));
const uidGen = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const GROUPS = {Legs:"Beine",Back:"Rücken",Chest:"Brust",Shoulders:"Schultern",Arms:"Arme",Abs:"Bauch",None:"Sonstige"};
const grp = g => GROUPS[g] || g || "Sonstige";
const fmtDate = ts => new Date(ts).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"});
const fmtDay = ts => new Date(ts).toLocaleDateString("de-DE",{weekday:"short",day:"2-digit",month:"2-digit"});
const fmtMonth = ts => new Date(ts).toLocaleDateString("de-DE",{month:"long",year:"numeric"});
const fmtDur = s => { if(s==null||s==="") return "–"; if(s<60) return "< 1 min"; const m=Math.round(s/60); return m>=60? `${Math.floor(m/60)} h ${m%60} min` : `${m} min`; };
const fmtKg = w => w==null || w==="" ? "KG" : (String(w).replace(".",",") + " kg");
const parseNum = v => { if (v==null) return null; const s=String(v).trim().replace(",","."); if(!s) return null; const n=Number(s); return isFinite(n)?n:null; };
function daysAgo(ts){ const d=Math.floor((Date.now()-ts)/86400000); return d<=0?"heute":d===1?"gestern":`vor ${d} Tagen`; }
function toast(msg){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=h("div",{class:"toast",role:"status",text:msg}); document.body.append(t); setTimeout(()=>t.remove(),2800); }
function setsSummary(sets){
  // group consecutive identical sets: "3 × 15 · 60 kg"
  const out=[]; let cur=null;
  for (const s of sets){ const key=s.r+"|"+(s.w??""); if(cur&&cur.key===key) cur.n++; else { cur={key,n:1,r:s.r,w:s.w}; out.push(cur);} }
  return out.map(c=>`${c.n} × ${c.r} · ${fmtKg(c.w)}`).join(", ");
}
function modal({title, body, actions}){
  const bg=h("div",{class:"modal-bg"});
  const close=()=>bg.remove();
  const box=h("div",{class:"modal",role:"dialog","aria-modal":"true","aria-label":title},
    h("h2",{text:title}), body||null,
    h("div",{class:"actions"}, (actions||[]).map(a=>h("button",{class:"btn "+(a.kind||""),onclick:async()=>{ const r=a.onClick?await a.onClick():undefined; if(r!==false) close(); }},a.label))));
  bg.addEventListener("click",e=>{ if(e.target===bg) close(); });
  bg.append(box); document.body.append(bg);
  box.setAttribute("tabindex","-1"); const f=box.querySelector("[data-autofocus]"); (f||box).focus({preventScroll:true});
  return close;
}

/* ---------- state + storage ---------- */
const S = { mode:"loading", routines:[], workouts:[], active:null, lastExport:null, dirty:false, exconf:{}, prefs:{comeback:true,pct:70,gapDays:21} };
/* Einstellungen pro Übung: Geräte-Einstellung, Ziel-Wiederholungen, Steigerungsschritt, Steigern aus */
const NO_PROGRESS_DEFAULT=new Set(["Beinpresse","Beinstrecker","Rückenstrecker","Bauchmaschine","Hip thrust"]);
function getConf(ex){ const c=S.exconf[ex]||{}; return {setup:c.setup||"",target:c.target??15,step:c.step??5,noProg:c.noProg??NO_PROGRESS_DEFAULT.has(ex)}; }
function setConf(ex,patch){ S.exconf[ex]=Object.assign({},getConf(ex),S.exconf[ex]||{},patch); markDirty(); }
let view = "home", editing = null, progEx = null, progMetric = "w";
let downloads=null;
const LS_KEY="trainingslog-v1";

function lsLoad(){ try{ const d=JSON.parse(localStorage.getItem(LS_KEY)||"{}"); return d; }catch(e){ return {}; } }
function lsSave(){ try{ localStorage.setItem(LS_KEY, JSON.stringify({routines:S.routines,workouts:S.workouts,active:S.active,lastExport:S.lastExport,dirty:S.dirty,exconf:S.exconf,prefs:S.prefs})); }catch(e){} }
function markDirty(){ S.dirty=true; lsSave(); }

function saveRoutines(){ markDirty(); }

function lastFor(ex){ for (const w of S.workouts){ const it=(w.items||[]).find(i=>i.ex===ex); if(it) return {w,it}; } return null; }
function knownExercises(){

  for (const w of S.workouts) for (const i of w.items||[]) if(!m.has(i.ex)) m.set(i.ex,i.group||"None");

}
function lastOfRoutine(name){ return S.workouts.find(w=>w.routine===name); }

function startWorkout(name,fill){
  let exs=[];

  }
  S.active={routine:name,startTs:Date.now(),note:"",items:exs.map(e=>newItem(e.ex,e.group,e.note,e.n))};

}
function newItem(ex,group,note,n){
  const last=lastFor(ex); const k=n||(last?last.it.sets.length:3);
  const P=S.prefs, comeback=!!(P.comeback && last && Date.now()-last.w.ts > P.gapDays*86400000);
  const step=getConf(ex).step||5;
  const scale=w=>{ if(w==null||!comeback) return w; const x=Math.round(w*P.pct/100/step)*step; return Math.max(step,Math.round(x*100)/100); };
  const sets=[]; for(let i=0;i<k;i++){ const ls=last?(last.it.sets[i]||last.it.sets[last.it.sets.length-1]):null; sets.push({r:null,w:null,sr:ls?ls.r:null,sw:ls?scale(ls.w):null}); }
  const it={ex,group:group||"None",note:note||"",sets};
  if (comeback && last.it.sets.some(s=>s.w!=null)) it.comeback={pct:P.pct,from:last.w.ts};
  return it;
}

function progressionHint(it,last,conf){
  if (conf.noProg || !last || it.progApplied || it.comeback) return null;
  const ls=last.it.sets; if(!ls.length) return null;
  const allReached=ls.every(s=>(s.r||0)>=conf.target);
  if (!allReached) return null;
  const ws=ls.map(s=>s.w);
  if (ws.every(w=>w==null)) return h("div",{class:"proghint"},h("b",{text:"Steigern?"}),h("span",{text:`Letztes Mal alle Sätze mit ${conf.target}+ Wdh. geschafft. Heute langsamer ausführen oder ein paar Wiederholungen mehr.`}));
  if (ws.some(w=>w==null)) return null;
  const top=Math.max(...ws), nw=Math.round((top+conf.step)*100)/100;
  return h("div",{class:"proghint"},h("b",{text:"Steigern?"}),
    h("span",{text:`Letztes Mal alle Sätze mit ${conf.target}+ Wdh. geschafft. Heute ${fmtKg(nw)} probieren?`}),
    h("button",{class:"btn small primary",onclick:()=>{ for(const s of it.sets){ if(s.r==null){ s.sw=nw; if(s.sr==null) s.sr=conf.target; } } it.progApplied=true; saveActiveSoon(); render(); toast(`Vorschlag auf ${fmtKg(nw)} gesetzt.`); }},`${fmtKg(nw)} übernehmen`));
}

async function finishWorkout(){
  const a=S.active;
  const items=a.items.map(i=>({ex:i.ex,group:i.group,sets:loggedSets(i).map(s=>({r:s.r,w:s.w}))})).filter(i=>i.sets.length);
  if (!items.length){ toast("Noch kein Satz erfasst."); return; }
  const dur=Math.max(0,Math.round((Date.now()-a.startTs)/1000));
  const w={id:"w-"+a.startTs,ts:a.startTs,date:new Date(a.startTs).toISOString(),routine:(a.routine||"Training").trim(),duration:dur,note:(a.note||"").trim(),items};
  await saveWorkout(w);
  S.active=null; await saveActiveNow(); clearInterval(tick);
  summaryId=w.id; summaryBack="home"; go("summary");
  exportCSV(true);
}

/* ---------- REKORDE ---------- */
function bestBefore(ex,beforeTs){
  let w=null,rAtW=0,rBW=0,any=false;
  for (const wk of S.workouts){ if(wk.ts>=beforeTs) continue; const it=(wk.items||[]).find(i=>i.ex===ex); if(!it) continue; any=true;
    for (const s of it.sets){ if(s.w==null){ rBW=Math.max(rBW,s.r||0); } else if(w==null||s.w>w){ w=s.w; rAtW=s.r||0; } else if(s.w===w){ rAtW=Math.max(rAtW,s.r||0); } } }
  return any?{w,rAtW,rBW}:null;
}
function recordFor(ex,sets,ts){
  const b=bestBefore(ex,ts); if(!b) return null;
  let best=null;
  for (const s of sets){ if(!(s.r>0)) continue;
    let hit=null;

function niceTicks(min,max,n=4){

  const t=[]; for(let v=lo; v<=hi+1e-9; v+=step) t.push(+v.toFixed(6));

}

  const lab=(t,anchor)=>add("text",{x:X(t),y:H-8,"text-anchor":anchor,"font-size":12,fill:"var(--muted)","font-family":"var(--body)"},new Date(t).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"2-digit"}));

      h("button",{class:"btn grow",onclick:()=>{editing=null;render();}},"Abbrechen"),
      r._new?null:h("button",{class:"btn danger grow",onclick:()=>modal({title:"Routine löschen?",body:h("p",{text:"Deine gespeicherten Trainings bleiben erhalten."}),actions:[{label:"Abbrechen"},{label:"Löschen",kind:"danger",onClick:()=>{S.routines=S.routines.filter(x=>x.id!==r.id);saveRoutines();editing=null;render();}}]})},"Löschen"))));
}

/* ---------- DATA: import / export ---------- */
function parseCSV(text){
  const rows=[]; let row=[], f="", q=false;
  for (let i=0;i<text.length;i++){
    const c=text[i];
    if (q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=c; }
    else if (c==='"') q=true;
    else if (c===","){ row.push(f); f=""; }
    else if (c==="\n"||c==="\r"){ if(c==="\r"&&text[i+1]==="\n") i++; row.push(f); rows.push(row); row=[]; f=""; }
    else f+=c;
  }
  if (f!==""||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>x!==""));
}
const MON={Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
function parseGHDate(s){
  const m=/^\w{3} (\w{3}) (\d{1,2}) (\d{4}) (\d{2}):(\d{2}):(\d{2}) GMT([+-])(\d{2})(\d{2})/.exec(s.trim());
  if (m && MON[m[1]]!=null){
    const off=(m[7]==="-"?-1:1)*(Number(m[8])*60+Number(m[9]));
    return Date.UTC(+m[3],MON[m[1]],+m[2],+m[4],+m[5],+m[6]) - off*60000;
  }
  const t=Date.parse(s); return isNaN(t)?null:t;
}
function importGymHero(text){
  const rows=parseCSV(text);
  if (!rows.length) throw new Error("Die Datei ist leer.");
  const hdr=rows[0].map(x=>x.trim());
  const col=n=>hdr.indexOf(n);
  const ci={num:col("Workout #"),date:col("Date"),wk:col("Workout"),ex:col("Exercise"),reps:col("Reps"),w:col("Weight"),g:col("Muscle group"),dur:col("Workout duration"),note:col("Workout note")};
  if (ci.num<0||ci.ex<0||ci.reps<0) throw new Error("Das sieht nicht nach einem Gym-Hero-Export aus (Spalten fehlen).");
  const byNum=new Map(); const out=[]; const rmap=new Map(); const conf={};
  for (const r of rows.slice(1)){
    const num=r[ci.num];
    if (num==="Setting"){ const ex=(r[ci.ex]||"").trim(); if(ex) conf[ex]={setup:(ci.note>=0?r[ci.note]:"")||"",target:parseNum(r[ci.reps])??15,step:parseNum(r[ci.w])??5,noProg:(r[col("Unit")]||"")==="no-progress"}; continue; }
    if (num==="Routine"){
      const name=r[ci.wk]; if(!name||!r[ci.ex]) continue;
      if(!rmap.has(name)) rmap.set(name,{id:uidGen("r"),name,exercises:[]});
      rmap.get(name).exercises.push({ex:r[ci.ex].trim(),group:(r[ci.g]||"None").trim()||"None",sets:parseNum(r[col("Set #")]),note:(ci.note>=0?r[ci.note]:"")||""});
      continue;
    }
    if (r[ci.date]){
      const ts=parseGHDate(r[ci.date]); if(ts==null) continue;
      const w={id:"w-"+ts,ts,date:new Date(ts).toISOString(),routine:r[ci.wk]||"Training",duration:Number(r[ci.dur])||0,note:(ci.note>=0?r[ci.note]:"")||"",items:[]};
      byNum.set(num,w); out.push(w); continue;
    }
    const w=byNum.get(num); if(!w||!r[ci.ex]) continue;
    const ex=r[ci.ex].trim(); let it=w.items[w.items.length-1];
    if (!it||it.ex!==ex){ it={ex,group:(r[ci.g]||"None").trim()||"None",sets:[]}; w.items.push(it); }
    const reps=parseNum(r[ci.reps]); if(reps==null) continue;
    it.sets.push({r:reps,w:parseNum(r[ci.w])});
  }
  return {workouts:out.filter(w=>w.items.length),routines:[...rmap.values()],conf};
}
function routinesFrom(workouts){
  const latest=new Map();
  for (const w of [...workouts].sort((a,b)=>b.ts-a.ts)) if(!latest.has(w.routine)) latest.set(w.routine,w);
  return [...latest.values()].map(w=>({id:uidGen("r"),name:w.routine,exercises:w.items.map(i=>({ex:i.ex,group:i.group,sets:i.sets.length,note:""}))}));
}
function csvEsc(v){ return '"'+String(v??"").replace(/"/g,'""')+'"'; }
function buildCSV(){
  const lines=[["Workout #","Date","Workout","Exercise","Set #","Reps","Weight","Unit","Muscle group","Workout duration","Link","Workout note"].map(csvEsc).join(",")];
  const asc=[...S.workouts].sort((a,b)=>a.ts-b.ts); const numOf=new Map(asc.map((w,i)=>[w.id,i+1]));
  for (const w of S.workouts){
    const n=numOf.get(w.id);
    lines.push([n,new Date(w.ts).toString(),w.routine,"","","","","","",w.duration||"","",w.note||""].map(csvEsc).join(","));
    for (const i of w.items||[]) i.sets.forEach((s,si)=>lines.push([n,"",w.routine,i.ex,si+1,s.r,s.w??"","kg",i.group||"None","","",""].map(csvEsc).join(",")));
  }
  for (const [ex,c] of Object.entries(S.exconf)) lines.push(["Setting","","",ex,"",c.target??"",c.step??"",c.noProg?"no-progress":"","","","",c.setup||""].map(csvEsc).join(","));
  for (const r of S.routines) for (const e of r.exercises) lines.push(["Routine","",r.name,e.ex,e.sets??"","","","",e.group||"None","","",e.note||""].map(csvEsc).join(","));
  return lines.join("\n")+"\n";
}
function backupCard(){
  if (!S.workouts.length && !S.routines.length) return null;
  const when=S.lastExport?`${fmtDate(S.lastExport)}, ${new Date(S.lastExport).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})} Uhr`:"noch nie";
  if (!S.dirty) return h("div",{class:"banner small",text:`CSV-Sicherung aktuell (${when}).`});
  return h("div",{class:"banner warn"},h("div",{class:"row spread wrap"},
    h("span",{text:`Nicht gesicherte Änderungen. Letzte CSV-Sicherung: ${when}.`}),
    h("button",{class:"btn small",onclick:()=>exportCSV(false)},"Jetzt sichern")));
}
function exportFilename(){ return "trainingstagebuch-sicherung.csv"; }
function exportDone(){ S.lastExport=Date.now(); S.dirty=false; lsSave(); softRender(); toast("CSV gesichert."); }
async function exportCSV(auto){
  const csv=buildCSV();
  if (downloads){
    try{ await downloads.save({filename:exportFilename(),data:csv}); exportDone(); return; }
    catch(e){
      if (e&&e.code==="declined"){ toast("Nicht gesichert – geht jederzeit über „Jetzt sichern“."); return; }
      if (e&&e.code==="rate_limited"){ toast("Bitte kurz warten und erneut sichern."); return; }
    }
  }
  // outside claude.ai (e.g. GitHub Pages): share sheet ("In Dateien sichern") where available, else normal download
  if (!window.claude){
    try{
      const file=new File([csv],exportFilename(),{type:"text/csv"});
      if (navigator.canShare && navigator.canShare({files:[file]})){
        await navigator.share({files:[file],title:"Trainingstagebuch-Sicherung"}); exportDone(); return;
      }
    }catch(e){ if(e&&e.name==="AbortError"){ toast("Nicht gesichert – geht jederzeit über „Jetzt sichern“."); softRender(); return; } if(e&&e.name==="NotAllowedError"){ softRender(); toast("Tippe auf „Jetzt sichern“, um die CSV zu speichern."); return; } }
    try{
      const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
      const a=h("a",{href:url,download:exportFilename()}); document.body.append(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),10000); exportDone(); return;
    }catch(e){}
  }
  // fallback: copyable text
  const ta=h("textarea",{class:"in",id:"csvFallback",readonly:true,style:"min-height:160px"}); ta.value=csv;
  modal({title:"CSV sichern",body:h("div",{class:"stack"},h("p",{class:"muted",text:"Der Download ist hier nicht verfügbar. Kopiere den Text und speichere ihn als .csv-Datei, zum Beispiel in der Dateien-App."}),ta),
    actions:[{label:"Schließen"},{label:"Kopieren & als gesichert markieren",kind:"primary",onClick:async()=>{ try{ await navigator.clipboard.writeText(csv); exportDone(); }catch(err){ ta.select(); toast("Text markiert – jetzt kopieren."); return false; } }}]});
}
function vData(main){
  $("#title").textContent="Daten";
  main.append(h("div",{class:"card"},
    h("h2",{text:"Speicherort"}),
    h("p",{class:"muted",text:"Deine Daten liegen nur auf diesem Gerät. Nach jedem Training sicherst du automatisch eine CSV mit allen Trainings und Routinen. Speicher sie am besten in iCloud Drive oder der Dateien-App. Auf einem neuen Gerät importierst du einfach die neueste CSV."}),
    h("div",{class:"muted small num",text:`${S.workouts.length} Trainings · ${S.routines.length} Routinen · App-Version ${APP_VERSION}`})));
  const bc=backupCard(); if(bc) main.append(bc);

  const P=S.prefs;
  const cbSw=h("button",{class:"switch",role:"switch","aria-checked":P.comeback?"true":"false","aria-label":"Wiedereinstieg nach Pause",onclick:()=>{P.comeback=!P.comeback;cbSw.setAttribute("aria-checked",P.comeback?"true":"false");lsSave();}},h("span"));
  main.append(h("div",{class:"card"},
    h("div",{class:"row spread"},h("h2",{text:"Wiedereinstieg nach Pause"}),cbSw),
    h("p",{class:"muted",text:"Hast du eine Übung länger nicht gemacht, schlägt die App weniger Gewicht vor. Danach steigerst du wie gewohnt über die Steigerungs-Hinweise."}),
    h("div",{class:"row"},
      h("label",{class:"f grow"},"Pause ab (Tage)",h("input",{class:"in",id:"pGap",inputmode:"numeric",value:P.gapDays,oninput:e=>{const v=parseNum(e.target.value); if(v){P.gapDays=v;lsSave();}}})),
      h("label",{class:"f grow"},"Vorschlag in % vom letzten Mal",h("input",{class:"in",id:"pPct",inputmode:"numeric",value:P.pct,oninput:e=>{const v=parseNum(e.target.value); if(v&&v>0&&v<=100){P.pct=v;lsSave();}}})))));
  const file=h("input",{type:"file",id:"csvFile",accept:".csv,text/csv",class:"hidden",onchange:async e=>{
    const f=e.target.files[0]; e.target.value=""; if(!f) return;
    let res; try{ res=importGymHero(await f.text()); }catch(err){ toast(err.message||"Datei konnte nicht gelesen werden."); return; }
    const wks=res.workouts;
    if(!wks.length && !res.routines.length && !Object.keys(res.conf||{}).length){ toast("Keine Trainings oder Routinen in der Datei gefunden."); return; }
    const existing=new Set(S.workouts.map(w=>w.id)); const fresh=wks.filter(w=>!existing.has(w.id));
    const fromRows=res.routines.length>0;
    const src=fromRows?res.routines:routinesFrom(wks);
    const newR=src.filter(r=>!S.routines.some(x=>x.name===r.name));
    const updR=fromRows?src.filter(r=>S.routines.some(x=>x.name===r.name)):[];
    modal({title:"Import prüfen",body:h("div",{class:"stack"},
      h("p",{class:"num",text:`${wks.length} Trainings gefunden, davon ${fresh.length} neu (vorhandene werden übersprungen).`}),
      h("p",{class:"muted num",text:newR.length?`${newR.length} Routinen kommen dazu: ${newR.map(r=>r.name).join(", ")}.`:(updR.length?"":"Alle Routinen gibt es schon.")}),
      updR.length?h("p",{class:"muted num",text:`${updR.length} Routinen werden aktualisiert: ${updR.map(r=>r.name).join(", ")}.`}):null),
      actions:[{label:"Abbrechen"},{label:"Importieren",kind:"primary",onClick:()=>{
        for (const u of updR){ const i=S.routines.findIndex(x=>x.name===u.name); S.routines[i]={...u,id:S.routines[i].id}; }
        S.routines.push(...newR); S.workouts.push(...fresh); sortWk(); if(updR.length) S.dirty=true;
        Object.assign(S.exconf,res.conf||{});
        // importing a backup is not a new change; keep the dirty flag as it was unless data already existed
        if (S.lastExport==null && !S.dirty) S.lastExport=Date.now(); else S.dirty=true;
        lsSave(); render(); toast(fresh.length?`${fresh.length} Trainings importiert.`:"Routinen importiert."); }}]});
  }});
  main.append(file);
  main.append(h("div",{class:"card"},
    h("h2",{text:"Import"}),
    h("p",{class:"muted",text:"Eine Sicherung dieser App oder deinen Gym-Hero-Export einlesen. Doppelte Trainings werden erkannt und übersprungen."}),
    h("button",{class:"btn primary",onclick:()=>file.click()},"CSV-Datei auswählen")));
  main.append(h("div",{class:"card"},
    h("h2",{text:"Sicherung"}),
    h("p",{class:"muted",text:"Alle Trainings und Routinen als eine CSV-Datei. Die neueste Datei enthält immer alles."}),
    h("button",{class:"btn",disabled:!S.workouts.length&&!S.routines.length,onclick:()=>exportCSV(false)},"CSV jetzt sichern")));
}

render();
init();
try{
  if ("serviceWorker" in navigator && location.protocol==="https:" && !window.claude){
    const hadCtrl=!!navigator.serviceWorker.controller; let reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hadCtrl && !reloaded && view!=="active" && view!=="activeEx"){ reloaded=true; location.reload(); } });
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{ r.update().catch(()=>{}); document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") r.update().catch(()=>{}); }); }).catch(()=>{});
  }
}catch(e){}
